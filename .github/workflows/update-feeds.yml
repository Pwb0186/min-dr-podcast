name: Opdater podcasts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3,5,6,7,8,9,12,16,18,20 * * *"
  push:
    branches:
      - main
    paths:
      - "podcasts.json"
      - "scripts/**"
      - ".github/workflows/update-feeds.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Brug Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Byg private feeds
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          DR_API_KEY: ${{ vars.DR_API_KEY }}
        run: npm run build

      - name: Klargør GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload side
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Udgiv til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
